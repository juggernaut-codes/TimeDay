name: Tests

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      XDG_DATA_HOME: /tmp/timeday-ci-data
      XDG_CONFIG_HOME: /tmp/timeday-ci-config
      XDG_CACHE_HOME: /tmp/timeday-ci-cache
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            python3 python3-gi python3-gi-cairo gir1.2-gtk-4.0 \
            gir1.2-dbusmenu-glib-0.4 python3-xlib libx11-6 libxss1 \
            desktop-file-utils
      - name: Run tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Check command-line interface
        run: |
          /usr/bin/python3 -m timeday --version
          /usr/bin/python3 -m timeday --help
      - name: Validate desktop entry
        run: desktop-file-validate data/io.github.timeday.TimeDay.desktop
      - name: Smoke-test user installation
        run: |
          /usr/bin/python3 install.py
          desktop-file-validate "$XDG_DATA_HOME/applications/io.github.timeday.TimeDay.desktop"
          releases=("$XDG_DATA_HOME"/timeday/releases/*)
          /usr/bin/python3 "${releases[0]}/launch.py" --version
